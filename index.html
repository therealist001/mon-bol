preps:[
{id:"tori-chintan",name:"Tori Chintan",type:"Bouillon",family:"Chintan",origin:"Japon · Tokyo",yield:"2,5 L",time:"4 h 45",level:"Intermédiaire",desc:"Bouillon clair de volaille, net et polyvalent. Une base de référence pour les ramen Shoyu et Shio.",image:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=900&q=80",ingredients:["1,5 kg de carcasses de poulet","500 g d'ailes ou de pilons","3,5 L d'eau froide","2 verts de poireau","30 g de gingembre","4 gousses d'ail","1 oignon","15 g de shiitake séchés"],steps:["Blanchir les carcasses et les ailes 5 minutes. Égoutter, puis rincer soigneusement les os et retirer les impuretés visibles.","Couvrir de 3,5 L d'eau froide et monter progressivement à 85–90 °C. Écumer soigneusement.","Maintenir une extraction douce pendant environ 4 heures, sans ébullition franche.","Ajouter les aromates et les shiitake pour les 45 à 60 dernières minutes.","Filtrer sans presser les solides. Refroidir rapidement, puis dégraisser après réfrigération."],notes:"La température et la durée sont des paramètres de départ à ajuster selon la marmite, la taille des os et le rendement réel. Refroidir rapidement en petits contenants ou au bain glacé."},
{id:"tori-paitan",name:"Tori Paitan",type:"Bouillon",family:"Paitan",origin:"Japon · Kyoto",yield:"2 L",time:"5 h 30",level:"Intermédiaire",desc:"Bouillon opaque et crémeux de volaille. L'émulsion des graisses et de la gélatine donne une texture nappante.",image:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=900&q=80",ingredients:["1,2 kg de carcasses de poulet","800 g d'ailes ou de pattes","3 L d'eau","1 oignon","30 g de gingembre","4 gousses d'ail"],steps:["Blanchir les os 5 minutes puis rincer soigneusement.","Couvrir d'eau et porter à ébullition soutenue. Maintenir une agitation thermique régulière.","Cuire environ 4 à 5 heures en surveillant le niveau et en ajoutant de l'eau chaude si nécessaire.","Ajouter les aromates pour la dernière heure, filtrer puis mixer brièvement si besoin pour homogénéiser."],notes:"Le résultat dépend de l'intensité de l'ébullition, de la quantité de collagène et de la réduction. Ne pas laisser une marmite sans surveillance."},
{id:"tonkotsu",name:"Tonkotsu",type:"Bouillon",family:"Paitan · porc",origin:"Japon · Hakata",yield:"2,5 L",time:"10–12 h",level:"Avancé",desc:"Bouillon d'os de porc longuement extrait et émulsionné, signature des ramen de Hakata.",image:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=900&q=80",ingredients:["1,5 kg d'os à moelle de porc","500 g de pieds de porc fendus","500 g de colonne vertébrale","Eau froide renouvelée","Ail, gingembre, poireau et oignon"],steps:["Blanchir les os, jeter l'eau, puis brosser et rincer minutieusement chaque pièce.","Recouvrir d'eau propre et maintenir une ébullition soutenue, en surveillant le niveau.","Poursuivre l'extraction jusqu'à obtenir une texture et une opacité satisfaisantes.","Ajouter les aromates en fin de cuisson, filtrer et homogénéiser si nécessaire."],notes:"Cuisson longue : surveillance continue indispensable. Une cocotte-minute demande un protocole spécifique et ne se substitue pas mécaniquement à une cuisson de 10–12 heures."},
{id:"gyokai",name:"Gyokai Dashi",type:"Dashi",family:"Extraction marine",origin:"Japon",yield:"1,5 L",time:"12 h 40",level:"Intermédiaire",desc:"Base marine combinant kombu, niboshi, shiitake et katsuobushi. Idéale pour un Double Soup.",image:"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80",ingredients:["1,6 L d'eau","20 g de kombu","40 g de niboshi nettoyés","25 g de katsuobushi","3 shiitake séchés"],steps:["Faire macérer kombu, niboshi et shiitake dans l'eau au réfrigérateur pendant 8 à 12 heures.","Chauffer progressivement et retirer le kombu avant l'ébullition.","Maintenir une légère extraction des niboshi et shiitake, puis couper le feu.","Ajouter le katsuobushi, laisser infuser quelques minutes et filtrer sans presser."],notes:"Les temps et températures varient selon les produits. Le Double Soup est un assemblage de bouillons : noter séparément les proportions et le moment du mélange."},
{id:"shoyu-tare",name:"Shoyu Tare",type:"Tare",family:"Liquide",origin:"Japon",yield:"≈ 250 ml",time:"25 min",level:"Facile",desc:"Assaisonnement concentré à base de sauces soja, mirin, saké et umami marin.",image:"https://images.unsplash.com/photo-1472476443507-c7a5948772fc?auto=format&fit=crop&w=900&q=80",ingredients:["150 ml de koikuchi","50 ml d'usukuchi","40 ml de mirin","40 ml de saké","5 g de kombu","10 g de katsuobushi","1–2 shiitake séchés"],steps:["Faire infuser à froid le kombu et les shiitake dans les liquides au réfrigérateur.","Chauffer doucement sans forte ébullition et retirer le kombu avant frémissement.","Hors du feu, ajouter le katsuobushi et laisser infuser.","Filtrer finement, refroidir rapidement et conserver au réfrigérateur."],notes:"Dosage initial à tester : 25–35 ml par bol selon la salinité du bouillon et des sauces soja. Conservation à établir selon le procédé réel ; ne pas considérer une durée longue comme acquise."},
{id:"shio-tare",name:"Shio Tare",type:"Tare",family:"Liquide · sel",origin:"Japon",yield:"≈ 250 ml",time:"25 min",level:"Facile",desc:"Assaisonnement salin qui laisse s'exprimer la finesse du bouillon et des ingrédients marins.",image:"https://images.unsplash.com/photo-1472476443507-c7a5948772fc?auto=format&fit=crop&w=900&q=80",ingredients:["120 ml de saké","60 ml de mirin","60 ml d'eau ou dashi","35 g de sel (à ajuster)","5 g de kombu","10 g de katsuobushi"],steps:["Chauffer saké et mirin pour réduire l'alcool, puis ajouter l'eau ou le dashi.","Dissoudre le sel hors du feu et laisser la température baisser.","Infuser le kombu puis le katsuobushi séparément, sans faire bouillir.","Filtrer et refroidir rapidement."],notes:"Le sel utilisé, le volume final et la salinité des autres composants influencent fortement le résultat. Mesurer et noter le rendement final."},
{id:"yakimiso",name:"Yakimiso · tare Miso",type:"Tare",family:"Pâte",origin:"Japon · Sapporo",yield:"≈ 380 g",time:"20 min",level:"Facile",desc:"Base riche associant miso rouge et blanc, sésame et aromates, inspirée du Miso Ramen de Sapporo.",image:"https://images.unsplash.com/photo-1472476443507-c7a5948772fc?auto=format&fit=crop&w=900&q=80",ingredients:["100 g de miso rouge","100 g de miso blanc","2 c. à s. de tahin","1 c. à s. d'huile de sésame","Saké, mirin et sauce soja","Ail, gingembre et sucre"],steps:["Réduire brièvement saké, mirin et sauce soja.","À feu doux, incorporer les deux misos, le tahin, l'huile et les aromates.","Mélanger sans faire bouillir jusqu'à obtenir une pâte homogène.","Refroidir rapidement et conserver au réfrigérateur dans un contenant propre."],notes:"Le terme Yakimiso renvoie à une préparation travaillée à la chaleur ; cette formule est une base de travail, pas une recette régionale unique ni une garantie de conservation longue."},
{id:"tantan-tare",name:"Tare Tantanmen",type:"Tare",family:"Sésame · piment",origin:"Japon · inspiration sichuanaise",yield:"≈ 350 g",time:"15 min",level:"Facile",desc:"Base crémeuse au sésame, soja, vinaigre noir et piment pour un Tantanmen intense.",image:"https://images.unsplash.com/photo-1472476443507-c7a5948772fc?auto=format&fit=crop&w=900&q=80",ingredients:["150 g de tahin ou neri goma","60 ml de sauce soja","30 ml de vinaigre noir Chinkiang","30–45 ml de rayu","20 g de miso ou doubanjiang","Sucre et poivre de Sichuan"],steps:["Mélanger tahin, miso ou doubanjiang et sucre.","Incorporer progressivement la sauce soja et le vinaigre noir.","Ajouter le rayu et le poivre de Sichuan.","Détendre au bouillon chaud au moment du service."],notes:"La pâte est concentrée : ajuster le dosage selon le bouillon, le piment et le sel du doubanjiang."},
{id:"negi-abura",name:"Negi-abura",type:"Huile",family:"Aromatique",origin:"Japon",yield:"≈ 200 ml",time:"25 min",level:"Facile",desc:"Huile douce d'oignon nouveau, échalote et gingembre, adaptée aux bouillons clairs.",image:"https://images.unsplash.com/photo-1472476443507-c7a5948772fc?auto=format&fit=crop&w=900&q=80",ingredients:["200 ml d'huile neutre","60 g d'oignon nouveau","40 g d'échalotes","15 g de gingembre"],steps:["Démarrer les aromates dans l'huile froide.","Chauffer doucement en surveillant la coloration et l'humidité résiduelle.","Retirer du feu avant que les aromates ne brûlent, filtrer et refroidir rapidement."],notes:"Huile contenant des aromates frais : ne pas conserver à température ambiante. Réfrigérer immédiatement et réfrigérer immédiatement et utiliser très rapidement selon les règles de sécurité applicables, ou congeler en petites portions."},
{id:"mayu",name:"Mayu",type:"Huile",family:"Ail carbonisé",origin:"Japon · Kumamoto",yield:"≈ 200 ml",time:"20 min",level:"Intermédiaire",desc:"Huile noire d'ail carbonisé, signature aromatique de certaines versions de ramen de Kumamoto.",image:"https://images.unsplash.com/photo-1472476443507-c7a5948772fc?auto=format&fit=crop&w=900&q=80",ingredients:["60 g d'ail émincé","100 ml d'huile neutre","Huile de sésame (facultative)"],steps:["Chauffer l'ail dans l'huile à feu modéré et contrôler précisément sa coloration.","Poursuivre jusqu'à une carbonisation maîtrisée, sans laisser l'huile s'enflammer.","Refroidir rapidement, mixer si souhaité et filtrer selon la texture recherchée."],notes:"Mayu signifie ici huile d'ail noircie/carbonisée, à distinguer de l'ail noir fermenté. Refroidir et réfrigérer immédiatement ; réfrigérer immédiatement et utiliser très rapidement selon les règles de sécurité applicables, ou congeler."},
{id:"rayu",name:"Rayu",type:"Huile",family:"Pimentée",origin:"Japon",yield:"≈ 250 ml",time:"30 min",level:"Intermédiaire",desc:"Huile pimentée infusée d'épices, utile pour Tantanmen et ramen relevés.",image:"https://images.unsplash.com/photo-1472476443507-c7a5948772fc?auto=format&fit=crop&w=900&q=80",ingredients:["200 ml d'huile neutre","35 g de flocons de piment","Sésame","Ail, gingembre, échalote","Poivre de Sichuan, badiane et cannelle"],steps:["Placer les flocons de piment, le sésame et le sel dans un récipient résistant à la chaleur.","Infuser les aromates dans l'huile à feu doux, puis filtrer les solides.","Verser prudemment l'huile chaude sur le piment en plusieurs fois en contrôlant la température.","Refroidir rapidement et réfrigérer."],notes:"La température d'infusion dépend du piment et de la finesse souhaitée. Toute huile contenant des ingrédients frais doit être traitée comme périssable."},
{"id":"pork-chintan","name":"Porc Chintan","type":"Bouillon","family":"Chintan · porc","origin":"Japon · base polyvalente","yield":"≈ 2 L","time":"5–7 h","level":"Intermédiaire","desc":"Bouillon clair de porc : extraction douce, écumage et contrôle de l'agitation pour préserver la limpidité. Base possible de shoyu ou de styles régionaux au porc.","ingredients":["1,5 kg d'os de porc charnus et articulations","3 L d'eau froide (à ajuster)","1 oignon","1 poireau","25 g de gingembre","Ail facultatif, en quantité modérée"],"steps":["Blanchir les os 5 à 10 min, jeter l'eau et rincer soigneusement la marmite et les os.","Recouvrir d'eau froide et monter progressivement en température. Écumer avant que les protéines ne se dispersent.","Maintenir une cuisson frémissante très douce, sans agitation forte, en complétant avec de l'eau chaude si nécessaire.","Ajouter les aromates pour la dernière heure afin qu'ils ne dominent pas l'extraction.","Filtrer sans presser. Refroidir rapidement en petits contenants peu profonds ou au bain glacé."],"notes":"Un chintan n'est pas simplement un bouillon filtré : sa limpidité dépend de la conduite thermique et de l'agitation. Le rendement et la gélatine varient fortement selon les os."},{"id":"niboshi-dashi","name":"Niboshi Dashi","type":"Dashi","family":"Poisson séché","origin":"Japon","yield":"≈ 1 L","time":"8–12 h + 20 min","level":"Intermédiaire","desc":"Extraction de petits poissons séchés, à la fois marine, iodée et parfois légèrement amère. Peut être servi seul ou intégré à un bouillon animal.","ingredients":["1 L d'eau froide","25–40 g de niboshi","Retirer têtes et viscères si l'on souhaite une tasse plus douce"],"steps":["Inspecter les niboshi et retirer têtes et viscères pour limiter l'amertume, selon le profil recherché.","Faire tremper au réfrigérateur 8 à 12 h.","Chauffer progressivement sans forte ébullition et goûter régulièrement.","Filtrer dès que l'extraction est suffisante. Ne pas presser les poissons."],"notes":"Le dosage dépend beaucoup de la taille, de l'espèce et du séchage. Les niboshi peuvent être plus puissants que le katsuobushi ; noter le produit utilisé."},{"id":"kombu-dashi","name":"Kombu Dashi","type":"Dashi","family":"Algue · glutamates","origin":"Japon","yield":"≈ 1 L","time":"30 min à 12 h","level":"Facile","desc":"Dashi délicat centré sur le kombu. L'infusion froide donne une extraction douce ; la montée en température permet un profil plus marqué.","ingredients":["1 L d'eau","8–15 g de kombu"],"steps":["Essuyer le kombu avec un linge propre si nécessaire ; ne pas le laver agressivement ni retirer systématiquement son voile blanc naturel.","Infuser dans l'eau froide au réfrigérateur plusieurs heures, ou chauffer lentement.","Retirer le kombu avant une ébullition franche pour éviter des notes trop marquées et une texture visqueuse excessive.","Utiliser immédiatement ou refroidir rapidement."],"notes":"La variété (Rausu, Rishiri, Ma) et l'épaisseur changent le résultat. Le kombu apporte notamment du glutamate ; il fonctionne en synergie avec les nucléotides du poisson ou de la viande."},{"id":"saba-dashi","name":"Saba-bushi Dashi","type":"Dashi","family":"Poisson fumé","origin":"Japon","yield":"≈ 1 L","time":"20 min","level":"Facile","desc":"Infusion de maquereau séché et fumé, plus ronde et robuste que le katsuobushi classique. Utile dans des bouillons marins soutenus.","ingredients":["1 L d'eau","15–25 g de saba-bushi en copeaux"],"steps":["Chauffer l'eau jusqu'au frémissement.","Ajouter le saba-bushi et maintenir une infusion douce quelques minutes.","Couper le feu, laisser déposer puis filtrer finement."],"notes":"Les produits fumés varient en intensité et en salinité. Éviter une longue ébullition qui peut accentuer l'amertume."},{"id":"chiyu","name":"Chiyu · graisse de poulet","type":"Huile","family":"Graisse aromatique","origin":"Japon","yield":"≈ 150 ml","time":"25–40 min","level":"Facile","desc":"Graisse de poulet clarifiée, parfois parfumée au gingembre ou à l'oignon nouveau. Donne brillance, rondeur et persistance aux ramen.","ingredients":["250 g de peau et graisse de poulet","2 c. à s. d'eau","Gingembre ou oignon nouveau facultatif"],"steps":["Couper la peau et la graisse en petits morceaux réguliers.","Mettre dans une casserole avec un peu d'eau et chauffer doucement pour faire fondre sans brûler.","Remuer de temps en temps jusqu'à ce que les morceaux soient dorés et que la graisse soit rendue.","Filtrer dans un récipient propre et refroidir rapidement."],"notes":"Traiter comme une matière grasse périssable : réfrigérer rapidement, conserver au froid et congeler en portions si elle ne sera pas utilisée rapidement. Les aromates frais raccourcissent encore la durée de conservation."},{"id":"ginger-oil","name":"Ginger-abura","type":"Huile","family":"Gingembre","origin":"Japon · variation maison","yield":"≈ 180 ml","time":"20 min","level":"Facile","desc":"Huile douce au gingembre, fraîche et légèrement piquante. Convient aux bouillons clairs de volaille ou de porc.","ingredients":["200 ml d'huile neutre","35 g de gingembre en fines lamelles","10 g d'oignon nouveau facultatif"],"steps":["Mettre le gingembre dans l'huile froide.","Chauffer à feu doux pour faire infuser sans frire brutalement.","Retirer du feu dès que le gingembre devient blond et très parfumé.","Filtrer et refroidir rapidement."],"notes":"L'huile contenant des aromates frais doit être réfrigérée sans délai et utilisée rapidement ; congeler le surplus. Ne pas stocker à température ambiante."},{"id":"tare-niboshi","name":"Niboshi Shoyu Tare","type":"Tare","family":"Shoyu · poisson","origin":"Japon · variation maison","yield":"≈ 300 ml","time":"12–24 h + 20 min","level":"Intermédiaire","desc":"Tare soja renforcé par une infusion de niboshi et kombu. À associer à un chintan de volaille ou de porc peu chargé en umami marin.","ingredients":["180 ml de koikuchi shoyu","50 ml d'usukuchi shoyu","40 ml de mirin","30 ml de saké","10–15 g de niboshi nettoyés","4 g de kombu"],"steps":["Infuser niboshi et kombu dans les sauces soja au réfrigérateur pendant une nuit.","Retirer le kombu et chauffer doucement le mélange avec mirin et saké.","Couper le feu, laisser reposer puis filtrer finement.","Refroidir rapidement et mesurer le volume final."],"notes":"Formule de travail, non canonique. Doser prudemment : les niboshi et les sauces soja peuvent apporter une salinité et une intensité très variables."},{"id":"ajitama","name":"Ajitama · œuf mariné","type":"Garniture","family":"Œuf","origin":"Japon","yield":"6 œufs","time":"6–8 h de marinade","level":"Facile","desc":"Œuf à cœur coulant, refroidi rapidement puis mariné au froid. Le contraste entre blanc assaisonné et jaune crémeux est essentiel.","ingredients":["6 œufs","100 ml de sauce soja","100 ml d'eau ou dashi","50 ml de mirin","50 ml de saké (facultatif)"],"steps":["Préparer une marinade, porter brièvement à frémissement si l'on souhaite cuire l'alcool, puis refroidir complètement.","Cuire les œufs dans l'eau frémissante selon leur calibre et la température initiale ; environ 6 min 30 à 7 min 30 constitue un point de départ à tester.","Refroidir immédiatement dans un bain glacé, puis écaler délicatement.","Placer les œufs dans la marinade au réfrigérateur 6 à 8 h, en les maintenant immergés ou en les retournant régulièrement.","Égoutter au moment du service et couper avec une lame propre."],"notes":"Le temps de cuisson doit être validé avec le calibre des œufs et le matériel. Utiliser des œufs propres et intacts, maintenir la marinade et les œufs au froid ; les œufs à jaune coulant ne sont pas pasteurisés."},{"id":"chashu-buta","name":"Chashu de porc braisé","type":"Garniture","family":"Porc","origin":"Japon · ramen-ya","yield":"1 poitrine de porc de 700–900 g","time":"2 h 30 + repos","level":"Intermédiaire","desc":"Poitrine de porc roulée ou non, braisée doucement dans un liquide soja, saké et aromates. La texture recherchée est tendre mais tranchable.","ingredients":["700–900 g de poitrine de porc","100 ml de koikuchi shoyu","100 ml de saké","100 ml d'eau","50 ml de mirin","Gingembre, ail, oignon nouveau","Sucre selon goût"],"steps":["Rouler et ficeler la poitrine si l'on souhaite des tranches rondes ; sinon garder la pièce entière.","Colorer légèrement toutes les faces dans une cocotte, puis retirer l'excès de graisse.","Ajouter les liquides et aromates ; compléter si nécessaire pour une cuisson régulière.","Braiser à couvert à petit frémissement en retournant la pièce, jusqu'à tendreté et cuisson complète.","Refroidir rapidement dans son liquide, puis réfrigérer. Retirer la ficelle et trancher froid ; réchauffer au service."],"notes":"La durée dépend de l'épaisseur et du morceau : vérifier la cuisson à cœur avec un thermomètre. Refroidir rapidement et conserver au froid ; ne pas laisser la viande dans la cocotte tiède."},{"id":"menma","name":"Menma assaisonné","type":"Garniture","family":"Bambou fermenté","origin":"Japon","yield":"≈ 250 g","time":"25 min","level":"Facile","desc":"Pousses de bambou fermentées et assaisonnées, apportant mâche, profondeur et une pointe acidulée.","ingredients":["200 g de menma préparé ou en conserve, égoutté","1 c. à s. d'huile de sésame","1 c. à s. de sauce soja","100 ml de dashi ou d'eau","Piment, sucre et poivre blanc facultatifs"],"steps":["Rincer et égoutter le menma selon les indications du produit ; goûter avant d'assaisonner.","Faire revenir brièvement dans l'huile de sésame.","Ajouter dashi et sauce soja, puis laisser réduire doucement.","Ajuster sucre ou piment. Refroidir rapidement et réfrigérer."],"notes":"Le menma du commerce est déjà préparé et peut être salé. Adapter l'assaisonnement au produit ; conserver au froid selon son étiquette et la préparation maison."},{"id":"kakuni","name":"Kakuni · porc fondant","type":"Garniture","family":"Porc braisé","origin":"Japon · Kyushu","yield":"4 portions","time":"2 h 30–3 h","level":"Intermédiaire","desc":"Morceaux épais de poitrine de porc braisés longuement jusqu'à devenir fondants. Une garniture généreuse, plus épaisse que le chashu tranché.","ingredients":["700 g de poitrine de porc en cubes","Gingembre et oignon nouveau","80 ml de sauce soja","80 ml de saké","50 ml de mirin","Eau et sucre selon goût"],"steps":["Couper la poitrine en gros cubes et colorer les faces.","Effectuer éventuellement un premier mijotage à l'eau avec gingembre pour dégraisser et attendrir.","Remplacer par le liquide d'assaisonnement et braiser à couvert à petit frémissement jusqu'à tendreté.","Dégraisser le jus, réduire séparément si nécessaire et napper les morceaux.","Refroidir rapidement et réfrigérer dans un contenant propre."],"notes":"Ne pas confondre kakuni et chashu : les morceaux, la texture et le service diffèrent. Vérifier la cuisson à cœur et appliquer les règles de refroidissement des viandes."},
,{id:"bouillon-jambon-chorizo",name:"Bouillon jambon cru & chorizo",type:"Bouillon",family:"Bouillon personnel · à documenter",origin:"Création personnelle · Europe",yield:"À préciser",time:"À préciser",level:"À documenter",desc:"Bouillon personnel réalisé avec un os de jambon cru, un peu de chorizo, du céleri, de la carotte, de l’oignon, du laurier et du clou de girofle. Fiche provisoire : proportions et protocole à compléter à partir de ton essai réel.",image:"",ingredients:["Os de jambon cru — quantité à préciser","Chorizo — quantité à préciser","Céleri — quantité à préciser","Carotte — quantité à préciser","Oignon — quantité à préciser","Laurier — quantité à préciser","Clou de girofle — quantité à préciser"],ingredientRefs:[{name:"Os de jambon cru"},{name:"Chorizo"},{name:"Céleri"},{name:"Carotte"},{name:"Oignon"},{name:"Laurier"},{name:"Clou de girofle"}],steps:["Protocole à compléter : noter le poids de l’os, la quantité de chorizo et le volume d’eau utilisés.","Consigner le temps de cuisson, la conduite thermique et le rendement filtré après ton prochain essai."],notes:"Fiche provisoire, non validée. L’os de jambon et le chorizo peuvent apporter beaucoup de sel : goûter avant tout ajout de tare ou de sel. Noter si l’os a été dessalé et le résultat réel de l’essai."}],
recipes:[
{id:"tokyo-shoyu",name:"Tokyo Shoyu Ramen",type:"Ramen",origin:"Tokyo · Japon",time:"45 min (hors préparations)",level:"Intermédiaire",desc:"Un bol classique et équilibré : bouillon clair de volaille, tare soja, huile de negi et nouilles fines.",image:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85",ingredients:["300–350 ml de Tori Chintan","30 ml de Shoyu Tare (point de départ)","10–15 ml de Negi-abura","1 portion de nouilles ramen fines","1 tranche de chashu","½ ajitama","Menma, nori et oignon nouveau"],steps:["Préchauffer le bol avec de l'eau très chaude, puis le vider et l'essuyer.","Chauffer le bouillon séparément. Préparer les garnitures et cuire les nouilles au dernier moment.","Déposer le tare et l'huile dans le bol, verser le bouillon chaud et mélanger.","Égoutter soigneusement les nouilles, les déposer dans le bol et disposer les garnitures."],notes:"Le tare et l'huile sont des points de départ : ajuster selon la salinité du bouillon et le goût recherché."},
{id:"sapporo-miso",name:"Sapporo Miso Ramen",type:"Ramen",origin:"Sapporo · Hokkaido",time:"50 min (hors préparations)",level:"Intermédiaire",desc:"Miso travaillé à la poêle, bouillon généreux, nouilles ondulées, maïs et beurre.",image:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85",ingredients:["300–350 ml de Tori Paitan ou Chintan corsé","35–40 g de Yakimiso (à ajuster)","10–15 ml d'huile de sésame","Nouilles ondulées moyennes","Porc haché ou chashu","Maïs, beurre, germes de soja et negi"],steps:["Faire revenir le porc et les légumes dans une poêle ou un wok.","Ajouter le Yakimiso et le travailler brièvement à feu doux pour libérer ses arômes.","Verser le bouillon chaud et homogénéiser sans réduire excessivement.","Cuire les nouilles, dresser puis ajouter maïs, beurre et oignon nouveau."],notes:"Le profil Sapporo est souvent associé au travail du miso et des garnitures au wok. Adapter la richesse du bouillon à la concentration du tare."},
{id:"tantanmen",name:"Tantanmen",type:"Ramen",origin:"Japon · inspiration sichuanaise",time:"35 min (hors bouillon)",level:"Intermédiaire",desc:"Sésame, piment, poivre de Sichuan et viande hachée dans un bol crémeux et relevé.",image:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85",ingredients:["300 ml de Tori Chintan ou Paitan","45–55 g de Tare Tantanmen","10–15 ml de Rayu","Nouilles ramen moyennes","Porc haché assaisonné","Pak choï, ciboule et cacahuètes"],steps:["Faire revenir le porc haché avec ail, gingembre et assaisonnement.","Déposer le tare au sésame dans le bol et le détendre avec une petite quantité de bouillon chaud.","Ajouter le reste du bouillon et l'huile pimentée.","Cuire les nouilles, dresser avec le porc, le pak choï et les garnitures."],notes:"Tantanmen est une adaptation japonaise du dan dan mian. Le bouillon, le niveau de piment et la présence de sésame varient selon les maisons."},
{id:"tonkotsu-kumamoto",name:"Tonkotsu · style Kumamoto",type:"Ramen",origin:"Kumamoto · Kyushu",time:"30 min (hors bouillon)",level:"Avancé",desc:"Bouillon tonkotsu riche, tare soja et touche de Mayu à l'ail carbonisé.",image:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85",ingredients:["300–350 ml de Tonkotsu","Tare Shoyu ou Shio selon le profil","10–15 ml de Mayu (à ajuster)","Nouilles fines","Chashu, ajitama, kikurage et negi"],steps:["Chauffer le tonkotsu et préparer les garnitures.","Déposer le tare et une petite quantité de Mayu dans le bol.","Verser le bouillon chaud et homogénéiser.","Cuire les nouilles très al dente, égoutter et dresser immédiatement."],notes:"Le Mayu est puissant : commencer avec peu et ajuster. Les variantes régionales ne sont pas uniformes."},
{"id":"hakata-tonkotsu","name":"Hakata Tonkotsu Ramen","type":"Ramen","origin":"Hakata · Fukuoka · Kyushu","time":"25 min (hors bouillon)","level":"Avancé","desc":"Tonkotsu blanc et dense, tare discret, nouilles très fines et droites, chashu, beni shoga et takana. Le kaedama permet de commander une portion supplémentaire de nouilles.","image":"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85","ingredients":["300–350 ml de tonkotsu","Tare shio ou shoyu, dosage progressif","10–15 ml de chiyu ou huile neutre","1 portion de nouilles très fines","Chashu, beni shoga, takana, negi"],"steps":["Chauffer le tonkotsu jusqu'à température de service et homogénéiser la matière grasse si nécessaire.","Placer le tare dans le bol, verser le bouillon et goûter avant de corriger.","Cuire les nouilles très fines séparément ; leur cuisson est rapide et doit être chronométrée.","Dresser avec chashu, gingembre rouge mariné, takana et negi. Servir immédiatement."],"notes":"Hakata est un style régional, pas une simple synonymie de tonkotsu. Nouilles fines et kaedama sont des marqueurs importants. La concentration du bouillon et le tare varient selon les maisons."},{"id":"kitakata-shoyu","name":"Kitakata Shoyu Ramen","type":"Ramen","origin":"Kitakata · Fukushima · Tohoku","time":"25 min (hors préparations)","level":"Intermédiaire","desc":"Shoyu généreux mais clair, souvent associé à un bouillon de porc et niboshi, avec des nouilles larges, plates et ondulées.","image":"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85","ingredients":["320 ml de porc chintan ou mélange porc-volaille","25–30 ml de shoyu tare","5–10 ml de chiyu","Nouilles larges, plates et ondulées","Chashu, menma, negi et narutomaki"],"steps":["Chauffer le bouillon clair et ajuster le tare en fonction de sa salinité.","Cuire les nouilles larges en vérifiant leur cœur : elles demandent souvent plus de temps que des nouilles fines.","Assembler tare, huile et bouillon dans le bol préchauffé.","Ajouter les garnitures classiques et servir sans attendre."],"notes":"Les nouilles de Kitakata sont souvent décrites comme épaisses, plates et ondulées, avec une texture souple. Le profil exact du bouillon varie selon les établissements."},{"id":"hakodate-shio","name":"Hakodate Shio Ramen","type":"Ramen","origin":"Hakodate · Hokkaido","time":"25 min (hors préparations)","level":"Intermédiaire","desc":"Ramen shio limpide et délicat, où la qualité du bouillon et la précision du dosage salin sont particulièrement visibles.","image":"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85","ingredients":["330 ml de tori chintan ou chintan volaille-fruits de mer","Shio tare mesuré","5–10 ml de chiyu clair","Nouilles fines à moyennes","Chashu, negi, menma et pousses"],"steps":["Préparer un bouillon clair et peu chargé en aromates dominants.","Mesurer le tare et commencer par une dose modérée ; goûter avec le bouillon réellement utilisé.","Ajouter une petite quantité d'huile pour porter les arômes sans masquer la finesse.","Cuire les nouilles et dresser sobrement."],"notes":"Le shio n'est pas nécessairement peu salé : il dépend d'un tare précisément construit. Hakodate est associé à une tradition de ramen shio, mais les recettes locales ne sont pas uniformes."},{"id":"iekei","name":"Yokohama Iekei Ramen","type":"Ramen","origin":"Yokohama · Kanagawa","time":"30 min (hors bouillon)","level":"Avancé","desc":"Rencontre d'un bouillon tonkotsu-poulet, d'un tare shoyu et d'une huile de poulet. Nouilles épaisses, épinards et nori en sont des repères visuels.","image":"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85","ingredients":["300–350 ml de bouillon porc-poulet émulsionné","25–35 ml de shoyu tare","10–15 ml de chiyu","Nouilles épaisses et droites","Chashu, épinards blanchis et feuilles de nori"],"steps":["Chauffer le bouillon jusqu'à ce qu'il soit bien homogène.","Assaisonner avec le tare shoyu et ajouter le chiyu.","Cuire les nouilles épaisses selon leur temps propre.","Dresser avec chashu, épinards et nori."],"notes":"Iekei désigne une lignée/style né à Yokohama, généralement associé à un bouillon porc-poulet, shoyu, nouilles épaisses, épinards et nori. Les réglages de fermeté, force et huile sont souvent personnalisables."},{"id":"asahikawa","name":"Asahikawa Shoyu Ramen","type":"Ramen","origin":"Asahikawa · Hokkaido","time":"25 min (hors préparations)","level":"Intermédiaire","desc":"Style connu pour son assemblage de bouillon animal et de dashi, avec une couche de graisse en surface qui aide à conserver la chaleur.","image":"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85","ingredients":["200 ml de porc ou volaille chintan","120 ml de dashi de poisson","25–30 ml de shoyu tare","5–10 ml de graisse ou huile aromatique","Nouilles moyennes, chashu, menma et negi"],"steps":["Préparer séparément bouillon animal et dashi pour pouvoir contrôler leur équilibre.","Commencer avec environ deux parts de bouillon animal pour une part de dashi, puis ajuster au goût : ce ratio est un essai, pas une norme.","Assaisonner au tare shoyu et ajouter une fine couche de matière grasse.","Cuire les nouilles et dresser."],"notes":"Le profil Asahikawa est souvent décrit comme une double soupe porc/poisson et une couche de graisse en surface. Les proportions changent selon les maisons."},{"id":"tsukemen","name":"Tsukemen · nouilles à tremper","type":"Ramen","origin":"Japon · Tokyo et variantes","time":"30 min (hors préparations)","level":"Intermédiaire","desc":"Nouilles servies séparément, souvent plus épaisses et fermes, avec une sauce de trempage concentrée et très chaude.","image":"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85","ingredients":["1 portion de nouilles épaisses","150–200 ml de bouillon concentré","Tare shoyu ou tare de poisson","Huile aromatique","Chashu, menma, nori et negi"],"steps":["Construire une sauce de trempage plus concentrée qu'un bouillon de ramen classique.","Chauffer la sauce et la servir dans un bol séparé.","Cuire les nouilles, les rincer à l'eau froide pour stopper la cuisson et retirer l'amidon de surface ; égoutter soigneusement.","Servir les nouilles froides ou tièdes selon le style, avec la sauce chaude et les garnitures.","En fin de repas, allonger éventuellement la sauce restante avec un bouillon (soup-wari)."],"notes":"Il existe des tsukemen chauds et froids, et des sauces très différentes. Le rinçage des nouilles est caractéristique de nombreuses versions, mais le service dépend du style."},{"id":"abura-soba","name":"Abura Soba","type":"Ramen","origin":"Tokyo · Japon","time":"20 min","level":"Facile","desc":"Ramen sans bol de soupe : sauce concentrée et huile au fond, nouilles égouttées, garnitures. Le convive mélange avant de manger.","image":"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85","ingredients":["1 portion de nouilles moyennes ou épaisses","15–20 ml de shoyu tare","10–15 ml d'huile aromatique","Vinaigre de riz et rayu au service","Chashu, negi, nori, menma et jaune d'œuf facultatif"],"steps":["Déposer tare, huile et éventuellement une pointe de vinaigre au fond du bol.","Cuire les nouilles, égoutter très soigneusement et déposer immédiatement sur la sauce.","Ajouter les garnitures puis mélanger vigoureusement avant dégustation.","Ajuster avec vinaigre ou rayu au fil du repas."],"notes":"Abura soba signifie littéralement soba/ramen à l'huile : l'absence de bouillon liquide distingue le plat. Les garnitures et sauces varient largement."},{"id":"tokyo-niboshi","name":"Tokyo Niboshi Shoyu","type":"Ramen","origin":"Tokyo · Japon · variation contemporaine","time":"25 min (hors préparations)","level":"Intermédiaire","desc":"Bol shoyu dominé par le caractère des petits poissons séchés, équilibré par un bouillon clair et une huile sobre.","image":"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85","ingredients":["330 ml de volaille chintan","20–30 ml de niboshi shoyu tare","5–10 ml de chiyu ou huile neutre","Nouilles fines à moyennes","Chashu, negi, menma et nori"],"steps":["Préparer un bouillon de volaille volontairement discret.","Assaisonner avec un tare niboshi en commençant bas, car l'intensité marine peut vite dominer.","Ajouter une huile neutre ou très douce.","Cuire les nouilles et dresser avec des garnitures sobres."],"notes":"Il s'agit d'une composition de travail inspirée des ramen niboshi modernes, pas d'une appellation régionale unique. Le profil peut aller du délicat au très puissant."},

["Koikuchi shoyu","Sauce soja japonaise standard, fermentée, brune et polyvalente. Base de nombreux tares shoyu.","Shoyu tare · Iekei · Tokyo"],["Usukuchi shoyu","Sauce soja japonaise plus claire en couleur mais souvent plus salée ; elle apporte du sel sans trop foncer le bouillon.","Shio tare · Tares"],["Tamari","Sauce soja souvent plus riche et moins céréalière, parfois sans blé selon le produit. Vérifier l'étiquette pour les allergènes.","Tares · Variantes sans blé"],["Saishikomi shoyu","Sauce soja doublement brassée, dense et complexe, à employer en petite proportion pour apporter profondeur.","Tares premium"],["Shiro shoyu","Sauce soja très claire, utile lorsque l'on veut assaisonner sans brunir fortement un bouillon clair.","Shio · Tares clairs"],["Kombu","Algue séchée apportant du glutamate. La variété et l'origine influencent l'intensité et la texture.","Kombu dashi · Double soup"],["Katsuobushi","Bonite séchée, fumée et fermentée, riche en composés aromatiques et nucléotides.","Dashi · Tares"],["Saba-bushi","Maquereau séché et fumé, généralement plus robuste et rond que le katsuobushi.","Dashi · Double soup"],["Ago / Yaki-ago","Poisson volant séché, parfois grillé, utilisé pour un dashi délicat et parfumé.","Dashi · Shio"],["Niboshi","Petits poissons séchés, souvent sardines, dont l'amertume dépend du produit et du nettoyage.","Niboshi dashi · Tare"],["Hoshi-shiitake","Shiitake séché, source de notes boisées et d'umami ; le trempage produit un liquide utile en dashi.","Dashi · Tares"],["Neri goma","Pâte de sésame japonaise, blanche ou noire, fine et riche. Elle donne corps aux Tantanmen.","Tare Tantanmen"],["Doubanjiang","Pâte fermentée de fèves et piments, salée et piquante. Son intensité varie selon les marques.","Tantanmen · Condiments"],["Chinkiang vinegar","Vinaigre noir chinois à base de céréales, profond et malté ; donne de la tension au Tantanmen.","Tare Tantanmen · Abura soba"],["Rayu","Huile pimentée japonaise ; peut être claire et aromatique ou contenir des épices et sédiments.","Tantanmen · Finition"],["Karashi takana","Feuilles de moutarde fermentées et pimentées, garniture typique de certains ramen de Kyushu.","Hakata tonkotsu"],["Beni shoga","Gingembre rouge mariné, acidulé et vif, qui tranche avec les bouillons gras.","Hakata · Tonkotsu"],["Kikurage","Champignon oreille-de-Judas, souvent réhydraté et émincé, apportant une mâche croquante.","Tonkotsu · Garnitures"],["Narutomaki","Pâte de poisson cuite en spirale rose, garniture emblématique de certains chuka soba.","Tokyo shoyu · Garnitures"],["Shiraga-negi","Oignon nouveau ou poireau émincé en très fins filaments ; apporte fraîcheur et texture.","Garniture · Huiles"],["Komatsuna","Moutarde-épinard japonaise, souvent blanchie brièvement pour garder couleur et tenue.","Shoyu · Shio"],["Menma","Pousses de bambou fermentées, assaisonnées ; apporte mâche et profondeur.","Garniture"],["Nori","Algue séchée en feuille ; se réhydrate au contact du bouillon et apporte une note marine.","Garniture"],["Kansui","Mélange alcalin de carbonates/potasse utilisé dans les nouilles ramen ; modifie couleur, texture et arôme.","Nouilles ramen"],["Farine à pain","Farine de blé relativement riche en protéines, utile pour développer un réseau de gluten résistant.","Nouilles ramen"],["Gluten de blé vital","Concentré de protéines de blé parfois ajouté pour augmenter la force et la mâche des nouilles.","Nouilles ramen"],["Panko","Chapelure japonaise légère ; pas un ingrédient central du ramen, mais utile dans certains accompagnements.","Accompagnements"],["Sésame blanc","Graines de sésame grillées ou non ; apportent gras, arôme et texture.","Tare · Huile · Garnitures"],["Poivre de Sichuan","Baie aromatique produisant une sensation légèrement engourdissante et citronnée, typique du profil mala.","Tantanmen"],

techniques:[
["Chintan vs Paitan","Comprendre la différence entre bouillon clair et bouillon émulsionné : agitation, température, extraction et texture."],
["Blanchiment des os","Pré-cuisson courte pour éliminer sang coagulé et impuretés avant l'extraction."],
["Extraction du kombu","Infusion à froid ou montée en température contrôlée pour limiter les notes indésirables."],
["Double Soup","Assemblage de deux extractions distinctes, généralement animale et marine, selon un ratio documenté."],
["Kansui maison","Transformation du bicarbonate alimentaire par chauffage pour obtenir du carbonate de sodium. Manipuler le produit obtenu avec précaution."],
["Aburi","Finition par chaleur directe et rapide pour colorer la surface d'une garniture."],
["Otoshibuta","Couvercle intérieur posé au contact du liquide pour favoriser une cuisson régulière."],
["Ajitama","Œuf mollet refroidi rapidement puis mariné au froid ; le temps dépend du calibre et de la température initiale."],
["Conduire un Chintan","Objectif : conserver un bouillon clair. Blanchir et rincer les os, démarrer à froid, écumer, puis maintenir une extraction douce sans agitation forte. Les bulles et le brassage dispersent les protéines et graisses ; la limpidité dépend autant de la conduite que du filtrage."],["Construire un Paitan","Objectif : obtenir une émulsion stable et opaque. Après nettoyage des os, maintenir une ébullition soutenue et une agitation thermique qui disperse les graisses et la gélatine. La turbidité n'est pas un défaut : elle est recherchée. Surveiller le niveau d'eau et ne jamais laisser une marmite longue cuisson sans surveillance."],["Blanchir et nettoyer les os","Plonger les os dans l'eau froide, porter à ébullition courte, égoutter, jeter l'eau et rincer les os ainsi que la marmite. Retirer les caillots et impuretés visibles. Cette étape nettoie la matière première mais ne remplace ni la cuisson complète ni une bonne hygiène."],["Écumer sans agiter","Sur un bouillon clair, retirer les protéines coagulées en surface avec une écumoire. Éviter de remuer inutilement pendant les premières phases, lorsque les impuretés remontent."],["Extraction du kombu","Infuser à froid au réfrigérateur ou chauffer progressivement. Retirer le kombu avant l'ébullition franche. Ajuster le grammage et la durée selon variété, épaisseur et résultat : une extraction plus longue n'est pas automatiquement meilleure."],["Infuser le katsuobushi","Ajouter les copeaux dans un liquide chaud hors du feu ou à frémissement très doux, laisser infuser brièvement puis filtrer. Presser les copeaux peut accentuer les notes tanniques et trouble le dashi."],["Nettoyer les niboshi","Retirer tête et viscères pour réduire certaines notes amères, puis ajuster la quantité et le temps d'infusion. Le résultat dépend de l'espèce, du séchage et de la taille du poisson."],["Assembler une Double Soup","Préparer séparément une base animale et une extraction marine, puis les mélanger au bol ou en marmite. Noter le ratio en masse ou en volume, la température et le tare ; modifier un seul paramètre à la fois pour comparer."],["Émulsionner un bouillon","Une ébullition soutenue, le collagène libéré et l'agitation dispersent les gouttelettes de graisse dans la phase aqueuse. Une émulsion peut se séparer au repos : réchauffer et homogénéiser avant le service."],["Clarifier un bouillon","La clarification vise à retirer les particules en suspension, par filtration soigneuse ou technique de clarification adaptée. Elle ne rend pas un bouillon microbiologiquement sûr et ne compense pas une mauvaise extraction."],["Réduire et concentrer","Faire évaporer l'eau augmente la concentration en sel, gélatine et composés aromatiques. Réduire avant d'avoir fixé le tare peut rendre le bol trop salé ; noter le poids ou volume avant/après."],["Construire un tare","Traiter le tare comme un concentré d'assaisonnement séparé du bouillon. Mesurer le sel, le volume final et le dosage par bol. Ajuster toujours avec le bouillon réel : une même quantité de tare ne fonctionne pas avec tous les fonds."],["Doser le tare au bol","Commencer avec une dose modérée, ajouter le bouillon chaud, mélanger et goûter avant d'ajuster. Noter la quantité finale en grammes ou millilitres par bol pour rendre le résultat reproductible."],["Infuser une huile aromatique","Démarrer à température modérée, surveiller l'humidité des aromates et arrêter avant toute carbonisation non souhaitée. Filtrer proprement. Les huiles maison avec ail, oignon ou herbes frais ne se conservent pas à température ambiante."],["Maîtriser le Mayu","Le mayu est une huile d'ail fortement brunie à carbonisée, pas de l'ail noir fermenté. La frontière entre amertume recherchée et brûlé désagréable est étroite ; procéder par petites quantités et contrôler la chaleur."],["Fabriquer le Kansui à partir de bicarbonate","La cuisson du bicarbonate de sodium le transforme en carbonate de sodium avec dégagement de dioxyde de carbone et d'eau. Utiliser une méthode et un protocole pesé fiables, laisser refroidir, étiqueter clairement et éviter toute confusion avec le bicarbonate alimentaire. Le carbonate est alcalin et irritant : éviter poussières et contact avec les yeux."],["Hydratation des nouilles","Calculer l'hydratation en pourcentage de la masse de farine : eau ÷ farine × 100. Le kansui et le sel sont généralement comptés séparément. Une pâte ramen peut sembler très sèche et granuleuse avant pressage ; ajouter l'eau progressivement et peser précisément."],["Pétrir et développer le gluten","Répartir le liquide alcalin uniformément sur la farine, sabler puis presser les grumeaux pour former une pâte cohérente. Le pétrissage et les passages successifs au laminoir organisent le réseau de gluten ; éviter de forcer une pâte trop épaisse dans les rouleaux."],["Laminer et plier","Aplatir progressivement, réduire l'épaisseur par paliers et replier la pâte lorsque le protocole le prévoit. Laisser reposer si elle se rétracte. Garder une épaisseur régulière pour une cuisson homogène."],["Couper et fariner les nouilles","Choisir la largeur selon le style et le bouillon. Séparer délicatement les brins et fariner légèrement avec farine ou amidon adapté pour éviter qu'ils collent ; retirer l'excédent avant cuisson."],["Cuire les nouilles au dernier moment","Cuire dans un grand volume d'eau non salée ou selon le protocole choisi, en remuant au départ. Chronométrer à partir de la reprise d'ébullition et goûter : épaisseur, hydratation, alcalinité et repos changent le temps."],["Réaliser un Ajitama","Cuire les œufs selon calibre et température initiale, refroidir immédiatement, écaler puis mariner au réfrigérateur. Noter précisément durée et résultat. Le jaune coulant n'est pas pasteurisé ; prudence pour les personnes vulnérables."],["Braiser un Chashu","Colorer éventuellement la viande, braiser à petit frémissement dans soja, saké, mirin et aromates, puis refroidir rapidement dans un contenant peu profond. Trancher froid pour des coupes nettes et réchauffer au service."],["Préparer les garnitures en mise en place","Laver, sécher, couper et conserver séparément les garnitures. Blanchir les légumes brièvement puis refroidir si nécessaire. Garder les éléments fragiles au froid et ne dresser qu'au dernier moment."],["Refroidir un bouillon en sécurité","Ne pas laisser une marmite volumineuse refroidir lentement sur le plan de travail. Répartir en petits contenants peu profonds, utiliser un bain glacé et réfrigérer rapidement. En Belgique, le SPF recommande de ne pas laisser les préparations à température ambiante plus de deux heures et de respecter la chaîne du froid."],["Congeler en portions","Refroidir rapidement, portionner dans des contenants adaptés, étiqueter avec nom, date et volume, puis congeler à −18 °C ou moins. Décongeler au réfrigérateur ou par méthode sûre ; ne pas recongeler un aliment décongelé."],["Réchauffer et servir","Réchauffer rapidement et uniformément ; garder les préparations chaudes à au moins 60 °C avant service selon les recommandations belges. Éviter les cycles répétés de refroidissement et réchauffage."],["Organiser le montage d'un bol","Préchauffer le bol, déposer tare et huile, verser le bouillon chaud, mélanger, ajouter les nouilles égouttées puis garnir. Les nouilles attendent le moins possible : elles continuent à absorber le liquide et perdent leur texture."],["Contrôler la salinité","Distinguer le sel du tare, celui des sauces soja, du miso, des garnitures et du bouillon réduit. Peser le sel et noter le volume final plutôt que de se fier uniquement à la dégustation."],["Distinguer les familles de ramen","Classer un bol par plusieurs axes : assaisonnement (shoyu, shio, miso), bouillon (chintan, paitan, tonkotsu, dashi), région, nouilles et mode de service. Les catégories se croisent : tonkotsu décrit d'abord le bouillon d'os de porc, pas une seule recette figée."],
]

{id:"ham-bone-ramen",name:"Ramen au jambon fumé",type:"Ramen · Fusion",origin:"Inspiration américaine · adaptation européenne",time:"1 h 30 minimum",yield:"Variable · selon l’os",level:"Facile",classification:"Fusion",validation:"Recette publiée dans la série Test Kitchen de Chef’s Roll ; proportions initiales non précisées, adaptation à calibrer.",sourceName:"Chef Mikel Anthony · Chef’s Roll Test Kitchen",sourceUrl:"https://chefsroll.com/test-kitchen/left-over-ham-ramen/",desc:"Bouillon d’os de jambon fumé, soja, gingembre et kombu : une piste concrète pour valoriser un jambon cuit ou un os de jambon local.",ingredients:["1 os de jambon fumé avec restes de viande","Eau juste suffisante pour couvrir l’os","2 c. à soupe de poudre d’ail","2 c. à soupe de poudre d’oignon","1 c. à café de gingembre en poudre","3 tiges d’oignon nouveau","120 ml de sauce soja (½ cup source)","1 morceau de kombu","Nouilles ramen fraîches","Œufs, sauce soja pour marinade brève, jambon réservé et oignon nouveau","Vinaigre de riz assaisonné pour le kombu mariné ; furikake ou shichimi facultatifs"],steps:["Couvrir l’os de jambon d’eau dans une marmite.","Ajouter ail, oignon, gingembre, oignons nouveaux et sauce soja. Porter à ébullition puis maintenir un frémissement doux au moins 1 heure.","Couper le feu et infuser le kombu 10 minutes. Retirer l’algue et filtrer.","Cuire les œufs 7 à 8 minutes, refroidir, écaler et laisser au moins 2 minutes dans un peu de sauce soja.","Saisir les morceaux de jambon réservés et déglacer avec un peu de sauce soja.","Cuire les nouilles à part. Répartir dans les bols, verser le bouillon et garnir de jambon, œuf et oignon nouveau.","Option : émincer le kombu et le faire mariner dans du vinaigre de riz assaisonné."],notes:"La source ne donne ni poids d’os, ni volume d’eau, ni rendement. Le dosage de soja doit être contrôlé : commencer avec moins si le jambon est déjà salé. La source ne contient pas de chorizo ; en ajouter ferait de ce bol une création personnelle {id:"turkey-ham-ramen",name:"Turkey Ramen au jambon et miso",type:"Ramen · Fusion",origin:"États-Unis · interprétation sudiste et asiatique",time:"4 h 15",yield:"4 bols + bouillon supplémentaire",level:"Intermédiaire",classification:"Fusion",validation:"Recette de chef publiée par Epicurious ; quantités documentées, non testée dans MON BOL.",sourceName:"Chef Edward Lee · Epicurious",sourceUrl:"https://www.epicurious.com/recipes/food/views/turkey-ramen-51197040",desc:"Carcasse de dinde, jambon cru, miso rouge, sauce poisson et soja ; tofu, shiitake, cresson et parmesan en garniture.",ingredients:["Carcasse d’une dinde de 5,4 à 6,4 kg ou 2 carcasses de poulet rôti","450 g de jambon cru avec os ou prosciutto en dés","1 gros oignon, 2 carottes moyennes","1 radis daikon de 15 cm (ou radis blanc long)","5 gousses d’ail, gingembre 5 cm, 1 citron","Environ 3,8 L d’eau, ou juste assez pour couvrir à 2,5 cm","2 œufs, 30 g de miso rouge","15 ml de sauce poisson, 12,5 ml de sauce soja, 10 ml de vinaigre blanc","Quelques traits de sauce piquante","340 g de nouilles ramen ou spaghettini fins","280 g de tofu soyeux, 170 g de shiitake, 1 avocat","2 oignons nouveaux, 1 botte de cresson","280 g de dinde ou poulet effiloché, 21 g de parmesan râpé, jus de citron"],steps:["Réserver environ 2 tasses de viande sur la carcasse. Découper la carcasse en morceaux maniables.","Mettre carcasse, jambon, légumes, ail, gingembre et citron dans une marmite. Couvrir d’eau à hauteur de 2,5 cm. Porter à ébullition en écumant, puis cuire à très léger frémissement 4 heures.","Filtrer et mesurer environ 1,9 L de bouillon pour les quatre bols. Garder le surplus.","Cuire les œufs 7 minutes, refroidir, écaler et couper en deux.","Porter le bouillon à ébullition. Ajouter miso, sauce poisson, soja, vinaigre et sauce piquante.","Ajouter les nouilles et cuire environ 3 minutes, selon leur format.","Répartir dans quatre bols et garnir de tofu, shiitake, avocat, oignon nouveau, cresson, viande, œuf, parmesan et citron."],notes:"Le parmesan est volontaire dans la recette d’Edward Lee : il apporte une note umami et noisettée. Le jambon cru ou un talon de jambon fumé local sont des options proches, mais leur salinité varie. Ne pas saler avant l’assemblage. Bouillon : jusqu’à 4 jours au réfrigérateur ou 3 mois au congélateur selon la source.",sourceStatus:"Recette de chef publiée · adaptation locale possible"},
{id:"everyman-pork-ramen",name:"Everyman Ramen · porc, pomme et soja",type:"Ramen · Fusion",origin:"Washington DC · États-Unis",time:"2 h 30",yield:"4 bols · environ 1,4 L",level:"Facile",classification:"Fusion",validation:"Recette attribuée au chef Erik Bruner-Yang dans une publication officielle ; non testée dans MON BOL.",sourceName:"Chef Erik Bruner-Yang · Washington.org",sourceUrl:"https://washington.org/sites/default/files/2021-03/RamenRecipe.pdf",desc:"Travers de porc, soja, pomme rouge, ail et gingembre réduisent ensemble. La pomme apporte une douceur fruitée qui arrondit le soja.",ingredients:["2,84 L d’eau","237 ml de sauce soja","½ carré de travers de porc, environ 340 à 450 g","170 g d’oignon jaune en dés","113 g de pomme rouge avec peau en dés","113 g d’ail haché (environ 3 têtes selon la source)","113 g de gingembre en dés","4 portions de nouilles ramen","Garnitures au choix : oignon nouveau, œuf, courge, patate douce, bonite, kombu, nori ou pâte de piment"],steps:["Mettre eau, soja, travers, oignon, pomme, ail et gingembre dans une marmite d’au moins 5,7 L.","Porter à frémissement, puis cuire à feu moyen-doux environ 2 h 30, jusqu’à réduction de moitié : la source annonce environ 1,4 L.","Retirer les travers et les séparer en portions. Filtrer les aromates et garder le bouillon chaud.","Cuire les nouilles séparément et répartir dans quatre bols.","Verser le bouillon et ajouter le porc et les garnitures."],notes:"La proportion de soja de la source est élevée (237 ml pour environ 1,4 L de bouillon final). Pour un premier essai, commencer avec une fraction, puis compléter progressivement. Cela modifie la formule originale : noter le dosage réel. Le poids de la demi-rack n’est pas plus précisément détaillé.",sourceStatus:"Recette de chef documentée · dosage de soja à vérifier"},
{id:"vegan-miso-mushroom-ramen",name:"Ramen végétal crémeux miso & champignons",type:"Ramen · Végétal",origin:"États-Unis · recette contemporaine",time:"3 h 15",yield:"4 à 6 bols",level:"Avancé",classification:"Végétale",validation:"Recette développée par J. Kenji López-Alt et publiée par Serious Eats ; protocole complet documenté, non testée dans MON BOL.",sourceName:"J. Kenji López-Alt · Serious Eats",sourceUrl:"https://www.seriouseats.com/vegan-ramen-miso-creamy-vegan-vegetarian-food-lab-recipe",desc:"Ramen végétal riche : légumes rôtis et mijotés, patate douce mixée, tare shiitake-soja, huile de champignons et finition miso-sésame.",ingredients:["1 petite aubergine, 1 oignon jaune moyen","2 têtes d’ail entières + 6 gousses pour le tare + 2 gousses hachées pour la finition","2 morceaux de gingembre de 10 cm","15 ml d’huile végétale","170 g de shiitake frais, pieds pour le bouillon et chapeaux pour le tare","170 g de maitake ou shimeji","1 morceau de kombu de 15 cm","14 g de cèpes séchés + 14 g de shiitake séchés pour le bouillon, mêmes quantités pour l’huile","6 feuilles de chou chinois, 1 poireau, 6 oignons nouveaux","1 patate douce moyenne","30 ml d’huile pour rôtir, 1 c. à soupe de shichimi, sel","120 ml de sauce soja + 120 ml de mirin pour le tare","120 ml d’huile végétale pour l’huile parfumée","1 c. à soupe de sésame grillé, 60 ml de miso blanc ou jaune","3 c. à soupe de pâte de sésame japonaise ou tahini","4 à 6 portions de nouilles ramen crues"],steps:["Griller aubergine, oignon, ail et gingembre huilés jusqu’à coloration et tendreté. Réserver l’aubergine ; régler le four à 204 °C.","Mettre oignon, gingembre, ail, pieds de champignons, kombu, champignons séchés, chou, poireau et oignons nouveaux dans une marmite. Couvrir d’eau à hauteur de 2,5 cm, porter à ébullition puis frémir 1 h 30.","Rôtir patate douce et champignons avec 30 ml d’huile, shichimi et sel environ 25 minutes.","Pour le tare, cuire chapeaux de shiitake, kombu, gingembre, oignons nouveaux, ail, soja et mirin à léger frémissement 30 minutes, jusqu’à réduction de moitié. Retirer aromates et kombu ; filtrer.","Chauffer doucement cèpes, shiitake séchés, oignons nouveaux et 120 ml d’huile jusqu’à frémissement. Couvrir et laisser infuser.","Récupérer la chair d’aubergine, retirer l’excès d’eau, mélanger avec sésame et 15 ml de tare. Ajouter le jus égoutté au bouillon.","Filtrer le bouillon. Presser l’ail cuit. Mixer l’ail et ½ cup de patate douce rôtie avec 240 ml de bouillon, puis incorporer au reste. La source annonce un peu plus de 1,9 L ; saler très légèrement.","Dans chaque bol chaud, mélanger tare, miso, tahini et ail cru. Verser le bouillon, ajuster, puis ajouter nouilles cuites à part, huile, champignons, patate douce, aubergine et oignons nouveaux."],notes:"Recette longue, dont les éléments peuvent être préparés à l’avance. Les maitake peuvent être remplacés par shimeji/beech mushrooms ou champignons de Paris selon la source ; le tahini remplace la pâte de sésame japonaise. Vérifier que nouilles, miso, soja et mirin conviennent à une alimentation végétale. Bouillon crémeux, mais pas un paitan animal.",sourceStatus:"Recette publiée et développée par Serious Eats"}

{id:"josh-hartnett-pork-ramen",name:"Pork Ramen · chashu et soffritto de pomme",type:"Ramen · Fusion",origin:"Royaume-Uni · recette contemporaine",time:"4 h + marinade une nuit",yield:"6 bols",level:"Avancé",classification:"Adaptation contemporaine",validation:"Recette issue du Friday Night Feast Cookbook, publiée par Jamie Oliver et attribuée à Josh Hartnett ; quantités et étapes documentées.",sourceName:"Josh Hartnett · Jamie Oliver",sourceUrl:"https://www.jamieoliver.com/recipes/pork/pork-ramen/",desc:"Poitrine de porc confite au four, tare shoyu au soffritto de pomme verte, bouillon poulet-dashi. Une recette européenne très structurée autour des cinq composants du ramen.",ingredients:["750 g de poitrine de porc sans peau","10 g de sel, 20 g de cassonade blonde, 30 ml de sauce soja peu salée pour le porc","1 oignon, 4 gousses d’ail, 3 cm de gingembre, 1 pomme verte acidulée","15 ml d’huile de colza","75 ml de saké, 75 ml de mirin, 100 ml de sauce soja peu salée pour le tare","1 L de bouillon de poulet de qualité + 1 L de dashi","450 g de nouilles ramen sèches (ou nouilles fraîches)","6 œufs marinés (recette source liée), 3 oignons nouveaux, 1 piment rouge"],steps:["La veille, frotter la poitrine de porc avec sel, sucre et 30 ml de soja. Couvrir et laisser mariner au réfrigérateur toute la nuit.","Préchauffer le four à 160 °C. Retirer l’excédent de marinade et cuire la poitrine couverte de papier aluminium dans un plat ajusté pendant environ 4 heures, jusqu’à tendreté. Réserver la graisse de cuisson.","Hacher très finement oignon, ail, gingembre et pomme épépinée. Faire suer avec l’huile à feu doux environ 45 minutes, sans coloration.","Pour le tare, porter saké et mirin à ébullition 4 minutes. Baisser le feu, ajouter les 100 ml de soja et le soffritto ; cuire encore 5 minutes.","À l’envoi, porter bouillon de poulet et dashi à ébullition puis maintenir 5 minutes à frémissement. Trancher finement le porc.","Dans chaque bol chaud, déposer 1 c. à soupe de tare et 1 c. à soupe de graisse de porc réservée, puis verser le bouillon.","Cuire les nouilles séparément (la source indique 45 secondes pour ses nouilles fraîches, sinon suivre le paquet). Répartir et garnir de porc, œuf mariné, oignon nouveau et piment."],notes:"La recette combine un chashu au four et un tare shoyu enrichi de pomme : ce n’est pas un style régional japonais traditionnel. Préparer le dashi séparément. La quantité de tare par bol est donnée par la source ; goûter et ajuster selon la salinité réelle du bouillon et du soja.",sourceStatus:"Recette de livre de cuisine publiée · méthode documentée"},
{id:"duck-ramen",name:"Ramen au canard, miso et shiitake",type:"Ramen · Fusion",origin:"Europe · recette STAUB / ZWILLING",time:"3 h 45",yield:"6 bols",level:"Intermédiaire",classification:"Adaptation européenne",validation:"Recette publiée par ZWILLING/STAUB avec quantités et protocole ; non testée dans MON BOL.",sourceName:"ZWILLING · recette STAUB",sourceUrl:"https://www.zwilling.com/fr/magazine/recettes/recipe-culinary-world-staub-cast-iron-duck-ramen.html",desc:"Canard entier transformé en bouillon, magret saisi à part, tare miso-soja, shiitake et pousses de bambou. Ingrédients faciles à trouver chez un volailler ou en grande surface.",ingredients:["1 canard prêt à cuire d’environ 1,8 kg","1 poireau, 1 bulbe de céleri-rave, 2 grosses carottes","Environ 3 L d’eau froide et du sel","2 gousses d’ail","15 ml d’huile de sésame","45 à 60 ml de sauce soja","60 à 75 ml de pâte miso","400 g de nouilles ramen","3 à 4 oignons nouveaux, 1 à 2 gros piments rouges","1 feuille de nori grillée","3 œufs mollets","Environ 12 petits shiitake, 100 g de pousses de bambou","Huile de sésame noir pour finir"],steps:["Séparer les magrets et les réserver. Détacher les cuisses ; couper poireau, céleri et carottes en morceaux.","Mettre cuisses, carcasse et légumes dans une marmite avec environ 3 L d’eau froide. Monter lentement à ébullition, écumer puis laisser frémir doucement 3 heures.","Filtrer finement le bouillon et saler selon le goût.","Faire revenir l’ail dans l’huile de sésame. Ajouter la sauce soja puis dissoudre le miso dans ce mélange. Répartir dans les bols.","Cuire les nouilles dans de l’eau bouillante salée. Émincer oignons nouveaux, piment et nori.","Effilocher la viande des cuisses. Saisir les magrets côté peau environ 5 minutes, retourner et cuire 2 minutes supplémentaires. Laisser reposer puis trancher.","Répartir nouilles, canard, shiitake, pousses de bambou et œufs coupés en deux. Verser le bouillon chaud et finir avec oignon nouveau, piment, nori et huile de sésame noir."],notes:"La recette source indique de saler le bouillon après filtration et d’assaisonner les bols avec le mélange miso-soja. Goûter avant d’ajouter du sel : miso et sauce soja apportent déjà beaucoup de sodium. Le bouillon est préparé avec cuisses et carcasse ; les magrets sont cuits séparément pour préserver leur texture.",sourceStatus:"Recette publiée · adaptation européenne documentée"},
{id:"kimchi-bacon-ramen",name:"Kimchi & Bacon Ramen",type:"Ramen · Fusion",origin:"États-Unis · inspiration coréenne",time:"1 h",yield:"4 bols",level:"Intermédiaire",classification:"Fusion",validation:"Recette de Food Network Kitchen avec quantités et protocole complets.",sourceName:"Food Network Kitchen",sourceUrl:"https://www.foodnetwork.com/recipes/food-network-kitchen/kimchi-and-bacon-ramen-5483396",desc:"Bacon croustillant, bouillon de poulet au miso, gingembre et pesto de kimchi. Une recette de fusion assumée, avec une garniture acidulée et pimentée.",ingredients:["120 ml + 10 ml d’huile végétale","4 oignons nouveaux, blancs et verts séparés grossièrement","1 morceau de gingembre de 4 cm","120 g de kimchi de chou + 60 ml de jus de kimchi et un peu plus pour servir","1 c. à soupe de graines de sésame grillées","5 ml de vinaigre de riz","6 tranches épaisses de bacon","2 gousses d’ail","650 ml de bouillon de poulet pauvre en sel","2 c. à soupe de miso jaune","10 ml de mirin","4 portions de nouilles ramen fraîches ou sèches (sans sachet d’assaisonnement)","Œufs mollets, oignons nouveaux et nori émincé pour servir"],steps:["Porter une grande casserole d’eau non salée à ébullition pour les nouilles.","Chauffer 120 ml d’huile sans la faire fumer. Hors du feu, ajouter la moitié des oignons nouveaux et du gingembre. Laisser tiédir 5 minutes.","Mixer cette huile avec le kimchi, les graines de sésame et le vinaigre de riz pour obtenir un pesto grossier. Réserver.","Faire dorer le bacon avec les 10 ml d’huile restants environ 12 minutes. Réserver quatre tranches pour la garniture ; émietter deux tranches.","Garder 15 ml de graisse de bacon dans la poêle. Faire revenir ail, reste des oignons nouveaux et gingembre environ 1 minute. Ajouter 350 ml de bouillon et le bacon émietté ; réduire de moitié environ 5 minutes.","Mixer ce bouillon avec le jus de kimchi, le miso, le mirin et les 300 ml de bouillon restants jusqu’à obtenir une base lisse.","Cuire les nouilles al dente (environ 1 min 30 fraîches ou 2 min 30 sèches), égoutter et répartir dans quatre bols. Verser le bouillon puis garnir de pesto de kimchi, bacon réservé, œuf mollet, oignon nouveau, nori et kimchi."],notes:"La source emploie 120 ml d’huile pour le pesto : c’est une quantité généreuse, à respecter pour la formule d’origine mais à doser avec parcimonie au service. Utiliser un bouillon pauvre en sel et ne pas saler l’eau des nouilles ; bacon, kimchi et miso sont déjà salés.",sourceStatus:"Recette de cuisine professionnelle publiée"},
{id:"bbc-mushroom-miso-ramen",name:"Mushroom Miso Ramen",type:"Ramen · Végétarien",origin:"Royaume-Uni · recette contemporaine",time:"30 min",yield:"2 bols",level:"Facile",classification:"Végétarienne",validation:"Recette publiée par BBC Good Food ; quantités et étapes disponibles.",sourceName:"Esther Clark · BBC Good Food",sourceUrl:"https://www.bbcgoodfood.com/premium/mushroom-miso-ramen",desc:"Version rapide aux champignons séchés et frais, miso blanc, tahini et pak choï. Un bol végétarien réalisable avec des produits courants.",ingredients:["1 L de bouillon de champignons","30 g de champignons séchés","15 g de tahini","3 c. à soupe de miso blanc","1 c. à soupe de sauce soja","22 ml de mirin","1 c. à café de vinaigre de riz","100 ml de lait ou boisson d’avoine","2 œufs","150 g de nouilles ramen sèches","2 petits pak choï coupés en deux","15 ml d’huile de sésame","150 g de shiitake frais","2 oignons nouveaux émincés","1 c. à soupe de graines de sésame grillées, facultatif"],steps:["Verser le bouillon dans une casserole avec les champignons séchés et porter à frémissement.","Délayer le tahini avec 100 ml de bouillon chaud dans un bol, puis reverser dans la casserole. Ajouter miso, soja, mirin, vinaigre et lait. Maintenir à feu très doux sans forte ébullition et goûter l’assaisonnement.","Cuire les œufs 6 à 7 minutes dans l’eau bouillante, refroidir et écaler.","Cuire les nouilles selon le paquet ; ajouter le pak choï dans les 4 dernières minutes. Égoutter et répartir dans deux bols.","Faire dorer les shiitake dans l’huile de sésame environ 4 minutes. Verser le bouillon sur les nouilles et répartir pak choï, champignons, oignons nouveaux et œufs coupés en deux. Ajouter le sésame."],notes:"Attention : BBC Good Food affiche une teneur en sel élevée pour cette recette (6,07 g par portion selon sa fiche nutritionnelle). Utiliser un bouillon sans sel ajouté, un miso moins salé si possible et réduire le soja ; goûter avant d’en rajouter. La recette reste végétarienne si le bouillon de champignons, le lait et les nouilles choisis le sont.",sourceStatus:"Recette publiée · vigilance particulière sur le sel"},
{id:"roast-dinner-ramen",name:"Ramen express aux restes de rôti",type:"Ramen · Adaptation",origin:"Royaume-Uni · cuisine anti-gaspillage",time:"40 min",yield:"2 bols",level:"Facile",classification:"Adaptation",validation:"Recette publiée par ALDI UK ; formule de dépannage et non style traditionnel japonais.",sourceName:"ALDI UK · Roast Dinner Ramen",sourceUrl:"https://www.aldi.co.uk/recipes/courses/mains/roast-dinner-ramen",desc:"Un bol de semaine pour recycler du poulet, porc ou bœuf rôti et des légumes déjà cuits, dans un bouillon rapide au gingembre, ail et soja.",ingredients:["3 gousses d’ail hachées","1 c. à soupe de gingembre frais râpé","½ piment rouge","3 oignons nouveaux","1 c. à soupe d’huile végétale","1 c. à café de granules de jus de rôti","1,5 L d’eau bouillante ou jus de rôti allongé à l’eau","1 cube de bouillon de poulet","2 c. à soupe de sauce soja","75 g de nouilles moyennes aux œufs","100 g de restes de poulet, porc ou bœuf cuits","150 g de restes de brocoli, carottes, haricots verts ou petits pois","Coriandre, 1 œuf, 1 c. à café de flocons de piment et ½ piment frais pour servir"],steps:["Cuire l’œuf 6 minutes dans l’eau bouillante, refroidir et réserver. Émincer le piment et les oignons nouveaux.","Faire revenir ail, gingembre, piment et oignons nouveaux dans l’huile pendant 2 minutes.","Ajouter eau ou jus de rôti allongé, granules de jus, cube de bouillon et sauce soja. Laisser frémir 15 minutes.","Ajouter les nouilles et cuire encore 4 minutes.","Répartir viande et légumes déjà cuits dans deux bols. Ajouter nouilles et bouillon chaud.","Couper l’œuf en deux et garnir chaque bol de coriandre et de piment."],notes:"Cette recette est explicitement une adaptation anti-gaspillage, pas un ramen traditionnel : elle utilise des nouilles aux œufs, du jus de rôti et des légumes de repas précédent. Le dosage de 1,5 L de liquide pour deux bols est généreux ; ajuster le volume au goût et à la quantité de nouilles. Le bouillon cube, le jus de rôti et la sauce soja pouvant être salés, goûter avant tout ajout de sel.",sourceStatus:"Recette express publiée · bol inspiré du ramen"},
{id:"miso-butter-ramen",name:"Miso Butter Ramen express",type:"Ramen · Végétarien",origin:"États-Unis · recette contemporaine",time:"15 min",yield:"1 bol",level:"Facile",classification:"Végétarienne · express",validation:"Recette développée par Jasmine Smith dans la cuisine d’essai de Serious Eats ; publiée en février 2026.",sourceName:"Jasmine Smith · Serious Eats",sourceUrl:"https://www.seriouseats.com/15-minute-miso-butter-ramen-recipe-11907783",desc:"Une version minute en une seule poêle : beurre et miso émulsionnent avec l’amidon des nouilles pour une sauce brillante, ail et pak choï en renfort.",ingredients:["28 g de beurre doux","20 g de miso blanc","1 gousse d’ail râpée ou finement hachée","360 ml d’eau","15 ml de sauce soja réduite en sel","1 paquet de nouilles ramen instantanées de 85 g, sans le sachet d’assaisonnement","1 petit pak choï d’environ 60 g, en morceaux","½ c. à café de chili crisp, facultatif","½ c. à café de cassonade blonde, facultatif","Œuf mollet et oignons nouveaux pour servir, facultatifs"],steps:["Faire fondre le beurre dans une poêle de 25 cm à feu moyen. Incorporer miso et ail en fouettant environ 1 minute, jusqu’à ce que le mélange soit lisse et parfumé.","Ajouter l’eau et la sauce soja, puis porter à frémissement.","Ajouter les nouilles et cuire environ 3 minutes en remuant de temps en temps.","Ajouter le pak choï et cuire environ 2 minutes, jusqu’à ce qu’il soit tendre et que la sauce épaississe légèrement autour des nouilles.","Hors du feu, incorporer chili crisp et cassonade si souhaité. Transférer dans un bol et garnir d’œuf mollet et d’oignons nouveaux."],notes:"La recette source est prévue pour une portion et se mange immédiatement. Le sachet d’assaisonnement des nouilles est écarté pour contrôler le sel. Le pak choï peut être remplacé par épinards ou chou frisé ; la source propose aussi du poulet rôti restant à la place de l’œuf. Pour doubler, multiplier les quantités mais utiliser une poêle assez grande pour garder une bonne évaporation.",sourceStatus:"Recette développée en cuisine d’essai · publiée en 2026"}
);
