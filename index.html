 return data.recipes.filter(r=>[r.name,r.desc,...(r.ingredients||[]),...(r.steps||[])].join(" ").toLowerCase().split(/[,.()·;:\n]/).some(part=>terms.some(t=>part.trim().includes(t))));
}
function renderMyBowls(){const rows=(data.myBowls||[]).slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));$("#content").innerHTML=sectionHead("Créations personnelles","Mes bols","Tes compositions enregistrées, indépendantes des recettes de référence.")+(rows.length?'<div class="grid">'+rows.map(x=>card(x,"Mon bol")).join("")+'</div>':'<div class="empty">Aucun bol enregistré pour le moment. Compose une création puis enregistre-la : elle apparaîtra ici.</div>')}
function renderDetail(id){
 const x=allEntries().find(y=>y.id===id);if(!x)return;selected=id;document.body.classList.toggle("detail-open",window.matchMedia("(max-width: 700px)").matches);
 const isBowl=(data.myBowls||[]).some(y=>y.id===id),isRecipe=data.recipes.some(y=>y.id===id),linked=isRecipe?linkedPreparations(x):[],usedBy=(!isRecipe&&!isBowl)?relatedRecipes(x):[];
 const links=isBowl?"":isRecipe?'<section class="relation-block"><h3>Préparations liées</h3>'+(linked.length?'<div class="relation-list">'+linked.map(p=>'<button class="btn relation-link" data-related="'+esc(p.id)+'">'+esc(p.name)+' ↗</button>').join("")+'</div>':'<p class="muted-note">Aucune préparation identifiée automatiquement dans cette recette. Les liens se préciseront au fil des fiches.</p>')+'</section>':'<section class="relation-block"><h3>Utilisée dans les recettes</h3>'+(usedBy.length?'<div class="relation-list">'+usedBy.map(r=>'<button class="btn relation-link" data-related="'+esc(r.id)+'">'+esc(r.name)+' ↗</button>').join("")+'</div>':'<p class="muted-note">Aucune recette liée détectée pour le moment.</p>')+'</section>';
 const journal="";
 const variant="";
 $("#content").innerHTML='<button class="btn" id="back">← Retour</button><div class="detail" style="margin-top:16px"><div class="eyebrow">'+esc(x.type||"Fiche")+' · '+esc(x.origin||"")+'</div><h2>'+esc(x.name)+'</h2><p class="lead">'+esc(x.desc||"")+'</p><div class="meta"><span>◷ '+esc(x.time||"")+'</span><span>Rendement : '+esc(x.yield||"variable")+'</span><span>'+esc(x.level||x.family||"")+'</span>'+(x.parentId?'<span>Variante de '+esc(data.recipes.find(r=>r.id===x.parentId)?.name||"recette")+'</span>':'')+'</div>'+links+'<div class="detail-cols"><div><h3>Ingrédients</h3><ul>'+(x.ingredients||[]).map(v=>{const match=findIngredientForLine(v);return '<li>'+(match?'<button class="ingredient-link" data-ingredient="'+match.index+'">'+esc(v)+'</button>':esc(v))+'</li>'}).join("")+'</ul></div><div><h3>Protocole</h3>'+(x.steps||[]).map((v,i)=>'<div class="step"><b>'+(i+1)+'</b><p>'+esc(v)+'</p></div>').join("")+'</div></div><div class="callout"><strong>Notes & points de vigilance</strong><br>'+esc(x.notes||"À compléter.")+'</div>'+(isRecipe&&x.classification?'<div class="callout"><strong>Repères éditoriaux · '+esc(x.classification)+'</strong><br>'+esc(x.validation||x.sourceStatus||"Référence du carnet")+(x.sourceName?'<br>Source : '+esc(x.sourceName):"")+(x.sourceUrl?'<br><a href="'+esc(x.sourceUrl)+'" target="_blank" rel="noreferrer">Consulter la recette source ↗</a>':"")+'</div>':"")+'<div class="modal-actions">'+(isBowl?'<button class="btn danger" id="delete-entry">Supprimer mon bol</button><button class="btn" id="edit-entry">Modifier mon bol</button>':!isRecipe?'<button class="btn danger" id="delete-entry">Supprimer la fiche</button><button class="btn" id="edit-entry">Modifier la fiche</button>':"")+'</div></div>';
 if(window.matchMedia("(max-width: 700px)").matches)window.scrollTo({top:0,behavior:"instant"});
}
function renderComposer(){
 const broths=data.preps.filter(x=>x.type==="Bouillon"||x.type==="Dashi"),tares=data.preps.filter(x=>x.type==="Tare"),oils=data.preps.filter(x=>x.type==="Huile");
 const opts=arr=>arr.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join("");
 const checks=[["Ajitama","Œuf mariné"],["Chashu","Chashu"],["Menma","Menma"],["Negi","Oignon nouveau"],["Nori","Nori"],["Kikurage","Champignons kikurage"],["Maïs","Maïs"],["Pak choi","Pak choi"],["Sésame","Sésame"]];
 $("#content").innerHTML=sectionHead("Atelier d'assemblage","Composer mon bol","Pars de tes préparations, choisis une direction gustative et obtiens une recette exploitable.")+
 '<div class="composer-layout"><section class="detail composer-panel"><div class="composer-kicker">01 · La structure</div><div class="form-grid">'+
 '<label>Bouillon<select class="field" id="c-broth">'+opts(broths)+'</select></label><label>Tare<select class="field" id="c-tare">'+opts(tares)+'</select></label><label>Huile aromatique<select class="field" id="c-oil">'+opts(oils)+'</select></label><label>Nombre de bols<input class="field" id="c-servings" type="number" min="1" max="12" value="2"></label>'+
 '<label class="wide">Direction gustative<select class="field" id="c-style"><option value="auto">Laisse les composants guider la recette</option><option value="clair">Clair & délicat</option><option value="riche">Riche & crémeux</option><option value="marin">Marin & umami</option><option value="epice">Épicé & sésame</option><option value="miso">Rond & fermenté</option></select></label>'+
 '<label class="wide">Nouilles<select class="field" id="c-noodles"><option>Nouilles fines droites</option><option>Nouilles moyennes</option><option>Nouilles épaisses et ondulées</option><option>Nouilles fraîches maison</option><option>Nouilles à tremper (tsukemen)</option></select></label></div>'+
 '<div class="composer-kicker" style="margin-top:25px">02 · Les garnitures</div><div class="composer-toppings">'+checks.map((x,i)=>'<label><input type="checkbox" class="c-top" value="'+esc(x[1])+'" '+(i<3?"checked":"")+'><span>'+esc(x[0])+'</span></label>').join("")+'</div><label class="composer-extra">Autre garniture <input class="field" id="c-extra" placeholder="Ex. porc haché épicé, pousses de soja…"></label>'+
 '<div class="composer-actions"><button class="btn" id="c-reset">Réinitialiser les choix</button></div></section><section class="detail composer-result" id="composition"><div class="composer-placeholder"><span class="eyebrow">03 · Ta recette</span><h2>Ton bol prend forme ici.</h2><p>La recette se construit automatiquement à mesure que tu modifies les bases, les quantités et les garnitures.</p></div></section></div>';
 updateComposition();
}
function updateComposition(){
 const get=id=>allEntries().find(x=>x.id===$(id)?.value);
 const b=get("#c-broth"),t=get("#c-tare"),o=get("#c-oil"),n=Math.max(1,Math.min(12,Number($("#c-servings")?.value||2)));
 if(!b||!t||!o)return;
 const style=$("#c-style")?.value||"auto",recipes=data.recipes||[];
 const match=recipes.find(r=>{const z=(r.name+" "+(r.desc||"")+" "+(r.ingredients||[]).join(" ")).toLowerCase();return (style==="epice"&&/tantan|sésame|rayu|piment/.test(z))||(style==="miso"&&/miso|yakimiso/.test(z))||(style==="marin"&&/niboshi|gyokai|shio|marine/.test(z))||(style==="riche"&&/paitan|tonkotsu|crémeux/.test(z))||(style==="clair"&&/shio|chintan|shoyu/.test(z))||(style==="auto"&&((b.id==="tonkotsu"&&/kumamoto|tonkotsu/i.test(r.name))||(t.id==="tantan-tare"&&/tantan/i.test(r.name))||(t.id==="yakimiso"&&/miso/i.test(r.name))||(t.id==="shoyu-tare"&&/shoyu/i.test(r.name))||(t.id==="shio-tare"&&/shio/i.test(r.name))))});
 const toppings=[...document.querySelectorAll(".c-top:checked")].map(x=>x.value),extra=$("#c-extra")?.value.trim();if(extra)toppings.push(extra);
 const brothMl=325*n,tareIsPaste=t.id==="yakimiso"||t.id==="tantan-tare",tareQty=(tareIsPaste?45:30)*n,oilMl=12*n;
 const title=style==="epice"?"Ramen sésame & piment":style==="miso"?"Ramen miso":style==="marin"?"Ramen marin umami":style==="riche"?"Ramen riche & crémeux":style==="clair"?"Ramen clair":"Bol "+t.name.replace(/ ·.*$/,"");
 const steps=["Réchauffer le bouillon doucement, sans le faire réduire inutilement.","Doser le tare dans chaque bol, verser le bouillon chaud et mélanger. Goûter avant d'ajouter du sel.","Cuire les nouilles séparément selon leur format, les égoutter soigneusement puis les déposer dans le bouillon.","Ajouter l'huile aromatique, puis disposer les garnitures sans les noyer."];
 const ingredients=[n+" portions de "+$("#c-noodles").value.toLowerCase(),brothMl+" ml de "+b.name,tareQty+(tareIsPaste?" g de ":" ml de ")+t.name,oilMl+" ml de "+o.name,...toppings.map(x=>n+" portion(s) : "+x)];
 const known=match?"Repère du carnet : "+match.name:"Composition originale à tester";
 $("#composition").innerHTML='<div class="composer-result-head"><div class="eyebrow">03 · '+esc(known)+'</div><h2>'+esc(title)+'</h2><p>'+n+' bol(s) · '+esc(b.name)+' · '+esc(t.name)+'</p></div><div class="composer-quantities"><div><b>'+brothMl+' ml</b><span>bouillon</span></div><div><b>'+tareQty+(tareIsPaste?" g":" ml")+'</b><span>tare · indicatif</span></div><div><b>'+oilMl+' ml</b><span>huile</span></div></div><h3>Ingrédients</h3><ul class="composer-list">'+ingredients.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>'+
 (match?'<div class="callout"><strong>Recette proche dans ton carnet · '+esc(match.name)+'</strong><br>'+(match.ingredients||[]).slice(0,5).map(esc).join(" · ")+'</div>':'')+'<h3>Montage</h3>'+steps.map((x,i)=>'<div class="step"><b>'+(i+1)+'</b><p>'+esc(x)+'</p></div>').join("")+
 '<div class="callout"><strong>À l’équilibre</strong><br>Le tare est le principal levier de salinité : commence avec la quantité proposée, goûte, puis ajuste par petites touches. L’huile se dose en finition. Les quantités sont des points de départ à valider avec tes préparations et leur concentration.'+(match?" La recette proche sert de repère, mais la sélection actuelle peut différer de sa formule originale.":" Aucun accord identique n'a été retrouvé : cette proposition est expérimentale.")+'</div><div class="composer-save"><button class="btn primary" id="c-save">Enregistrer cette recette</button></div>';
 $("#composition").dataset.recipeName=title;$("#composition").dataset.ingredients=JSON.stringify(ingredients);$("#composition").dataset.steps=JSON.stringify(steps);$("#composition").dataset.notes=known+". Dosages indicatifs générés par le composeur ; ajuster selon la concentration réelle du tare et du bouillon.";
}
function render(){document.body.classList.remove("detail-open");renderHero();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="home")renderHome();if(view==="recipes"||view==="preps")renderList(view);if(view==="ingredients")renderIngredients();if(view==="techniques")renderTechniques();if(view==="composer")renderComposer();if(view==="my-bowls")renderMyBowls()}
function openForm(item){const isRecipe=view==="recipes",kind=view==="my-bowls"?"myBowls":isRecipe?"recipes":"preps";$("#modal-title").textContent=item?(kind==="myBowls"?"Modifier mon bol":"Modifier la fiche"):"Nouvelle fiche";const fields=[["name","Nom",item?.name||""],["type","Type",item?.type||(isRecipe?"Ramen":"Bouillon")],["origin","Origine",item?.origin||""],["time","Temps",item?.time||""],["yield","Rendement",item?.yield||""],["level","Difficulté",item?.level||""],["desc","Description",item?.desc||""],["ingredients","Ingrédients (une ligne par élément)",(item?.ingredients||[]).join("\n")],["steps","Étapes (une ligne par étape)",(item?.steps||[]).join("\n")],["notes","Notes & conservation",item?.notes||""]];$("#form-fields").innerHTML=fields.map((f,i)=>'<label class="'+(i>5?"wide":"")+'">'+f[1]+(i===6||i>6?'<textarea name="'+f[0]+'" rows="'+(i>6?4:2)+'">'+esc(f[2])+'</textarea>':'<input name="'+f[0]+'" value="'+esc(f[2])+'" '+(i===0?"required":"")+'>')+'</label>').join("");$("#entry-form").dataset.id=item?.id||"";$("#entry-form").dataset.kind=kind;$("#modal").classList.add("open")}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(b){view=b.dataset.view;filter="";typeFilter="Tous";render()}});
function deleteEntry(kind,id){const arr=data[kind];const item=arr?.find(x=>x.id===id);if(!item)return;if(!confirm("Supprimer définitivement « "+item.name+" » ? Cette suppression sera conservée après synchronisation."))return;arr.splice(arr.indexOf(item),1);data.deletedEntries=Array.isArray(data.deletedEntries)?data.deletedEntries:[];const tombstone=kind+"::"+id;if(!data.deletedEntries.includes(tombstone))data.deletedEntries.push(tombstone);selected=null;save();render()}
function deleteReference(kind,index){const arr=data[kind],item=arr?.[index];if(!item)return;const name=Array.isArray(item)?item[0]:item.name;if(!confirm("Supprimer définitivement « "+name+" » de la bibliothèque ?"))return;arr.splice(index,1);data.deletedEntries=Array.isArray(data.deletedEntries)?data.deletedEntries:[];const tombstone=kind+"::"+name;if(!data.deletedEntries.includes(tombstone))data.deletedEntries.push(tombstone);save();render()}
$("#content").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open]")){e.preventDefault();renderDetail(e.target.dataset.open)}});
$("#hero-discovery").addEventListener("click",e=>{const item=e.target.closest("[data-open]");if(item)renderDetail(item.dataset.open)});
$("#hero-discovery").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open]")){e.preventDefault();renderDetail(e.target.dataset.open)}});
$("#content").addEventListener("click",async e=>{const related=e.target.closest("[data-related]");if(related){renderDetail(related.dataset.related);return}const journalOpen=e.target.closest("[data-journal-open]");if(journalOpen){renderDetail(journalOpen.dataset.journalOpen);return}if(e.target.id==="create-variant")return;const delRef=e.target.closest("[data-delete-ref]");if(delRef){const [kind,index]=delRef.dataset.deleteRef.split("|");deleteReference(kind,Number(index));return}if(e.target.id==="delete-entry"){deleteEntry((data.myBowls||[]).some(x=>x.id===selected)?"myBowls":data.recipes.some(x=>x.id===selected)?"recipes":"preps",selected);return}const o=e.target.closest("[data-open]");if(o){renderDetail(o.dataset.open);return}if(e.target.id==="back-to-recipe"){if(selectedIngredientReturn)renderDetail(selectedIngredientReturn);else{view="recipes";render()}return}const ingredient=e.target.closest("[data-ingredient]");if(ingredient){renderIngredientDetail(Number(ingredient.dataset.ingredient),selected);return}if(e.target.id==="back"){view=(data.myBowls||[]).some(x=>x.id===selected)?"my-bowls":selected&&data.recipes.some(x=>x.id===selected)?"recipes":"preps";render();return}if(e.target.id==="c-reset"){renderComposer();return}if(e.target.closest("#c-save")){e.preventDefault();e.stopPropagation();const box=$("#composition");if(!box?.dataset.recipeName)return;const id="bol-"+Date.now();const servings=Math.max(1,Math.min(12,Number($("#c-servings")?.value||2)));const recipe={id,name:box.dataset.recipeName,type:"Mon bol",origin:"Création personnelle",time:"À définir",yield:servings+" bols",level:"À tester",desc:"Composition personnelle créée dans l’atelier MON BOL.",ingredients:JSON.parse(box.dataset.ingredients||"[]"),steps:JSON.parse(box.dataset.steps||"[]"),notes:box.dataset.notes||"",image:"",createdAt:new Date().toISOString(),source:"composer",trials:[]};data.myBowls=Array.isArray(data.myBowls)?data.myBowls:[];data.myBowls.unshift(recipe);const persisted=await save();view="my-bowls";filter="";typeFilter="Tous";render();renderDetail(id);$("#content").insertAdjacentHTML("afterbegin",'<div class="callout" role="status"><strong>Bol enregistré.</strong> Cette fiche est ta composition exacte, indépendante des recettes de référence. '+(persisted?"Synchronisation D1 confirmée.":"Copie locale conservée ; synchronisation D1 à vérifier.")+'</div>');return}if(e.target.id==="add-entry")openForm(null);if(e.target.id==="edit-entry"){const x=allEntries().find(y=>y.id===selected);view=(data.myBowls||[]).some(y=>y.id===selected)?"my-bowls":data.recipes.some(y=>y.id===selected)?"recipes":"preps";openForm(x)}});
$("#content").addEventListener("submit",e=>{});
$("#content").addEventListener("input",e=>{if(e.target.id==="search"){filter=e.target.value;const pos=e.target.selectionStart;renderList(view);const s=$("#search");s.focus();s.setSelectionRange(pos,pos)}if(e.target.id==="c-servings"||e.target.id==="c-extra")updateComposition()});
$("#content").addEventListener("change",e=>{if(e.target.id==="type-filter"){typeFilter=e.target.value;renderList(view)}if(e.target.id.startsWith("c-")||e.target.classList.contains("c-top"))updateComposition()});
$("#cancel").onclick=()=>$("#modal").classList.remove("open");
$("#entry-form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),kind=e.target.dataset.kind,id=e.target.dataset.id||("fiche-"+Date.now());const old=allEntries().find(x=>x.id===id)||{};const obj={...old,id,name:f.get("name"),type:f.get("type"),origin:f.get("origin"),time:f.get("time"),yield:f.get("yield"),level:f.get("level"),desc:f.get("desc"),ingredients:String(f.get("ingredients")).split("\n").map(x=>x.trim()).filter(Boolean),steps:String(f.get("steps")).split("\n").map(x=>x.trim()).filter(Boolean),notes:f.get("notes"),image:old.image||""};const index=data[kind].findIndex(x=>x.id===id);if(index>=0)data[kind][index]=obj;else data[kind].unshift(obj);save();$("#modal").classList.remove("open");view=kind;render()};
(async()=>{await load();render()})();
